[package]
name = "vibeslash"
description = "VibeSlash 指令助手 Windows 版：在 Claude、ChatGPT（Codex）桌面 App 和终端里按快捷键呼出斜杠指令面板"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "vibeslash_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
vibeslash-detect.workspace = true
vibeslash-platform.workspace = true
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-store = "2.5"
