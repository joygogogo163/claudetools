[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/joygogogo163/claudetools"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vibeslash-detect = { path = "crates/vibeslash-detect" }
vibeslash-platform = { path = "crates/vibeslash-platform" }

[profile.release]
# 体积优先：桌面助手常驻后台，安装包越小越好
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
