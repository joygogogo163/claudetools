<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Code 指令助手</title>
    <link rel="stylesheet" href="../shared/page.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="slash mono">/</span>
      <input id="query" type="text" placeholder="搜索指令或用途" aria-label="搜索指令" autocomplete="off" spellcheck="false" />
    </header>
    <p id="status" class="status" hidden></p>
    <ul id="list" class="list" role="listbox" aria-label="指令"></ul>
    <footer>
      <button id="open" class="btn primary" type="button">在页面打开面板 <kbd id="shortcut"></kbd></button>
      <button id="settings" class="btn" type="button">设置</button>
    </footer>
    <script src="../commands.js"></script>
    <script src="../core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
