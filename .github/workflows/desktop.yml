name: desktop

# 发布见 release.yml：它调用本工作流和 extension.yml，把三个安装包放进同一个 Release
on:
  push:
    branches: ['**']
    paths:
      - 'apps/windows/**'
      - 'apps/macos/**'
      - 'packages/core/**'
      - 'assets/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'apps/windows/**'
      - 'apps/macos/**'
      - 'packages/core/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows

      - run: pnpm install --frozen-lockfile
      - name: Rust 测试（识别规则、窗口位置、子进程）
        run: cargo test --workspace --exclude vibeslash
      - name: 界面测试
        run: pnpm test
      # Tauri 编译时要嵌入界面，先构建界面再跑 clippy
      - run: pnpm build:ui
      - run: cargo clippy --workspace -- -D warnings
      - name: 构建安装包
        run: pnpm tauri build

      - name: 整理产物
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe "out/VibeSlash-$version-windows-x64-setup.exe"
          Compress-Archive -Path target/release/VibeSlash.exe -DestinationPath "out/VibeSlash-$version-windows-x64-portable.zip"
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: vibeslash-windows
          path: apps/windows/out/*

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Swift 测试（搜索和识别与 TypeScript 参考实现一致、窗口位置）
        run: swift test
      - name: 构建 VibeSlash.app 并打包 dmg / zip
        run: scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vibeslash-macos
          path: |
            apps/macos/build/*.dmg
            apps/macos/build/*.zip
