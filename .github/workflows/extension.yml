name: extension

# 发布见 release.yml：它调用本工作流和 desktop.yml，把三个安装包放进同一个 Release
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/extension
      # 生成的数据和 README 表格必须是最新的
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Windows 版界面交互测试
        run: pnpm --filter @vibeslash/windows test:ui
      - run: pnpm zip
        working-directory: apps/extension

      - uses: actions/upload-artifact@v4
        with:
          name: vibeslash-extension
          path: apps/extension/dist/*.zip
